---
name: 🚀 Release
"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skill
        run: python3 scripts/validate_skill.py

      - name: Package skill
        run: |
          mkdir -p dist
          (cd skill && zip -r "../dist/avoid-software-falsehoods-${GITHUB_REF_NAME}.zip" avoid-software-falsehoods)
          tar czf "dist/avoid-software-falsehoods-${GITHUB_REF_NAME}.tar.gz" -C skill avoid-software-falsehoods

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
