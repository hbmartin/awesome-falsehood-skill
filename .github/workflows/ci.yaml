---
name: ✅ CI
"on":
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skill package
        run: python3 scripts/validate_skill.py

      - name: Install test dependencies
        run: python3 -m pip install pytest

      - name: Run tests
        run: python3 -m pytest tests/ -q
